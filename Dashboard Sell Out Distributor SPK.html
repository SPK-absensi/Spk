    items.push([t1>0.25?'warn':'info','Customer terbesar '+c[0].cn+' = '+pc(t1)+' omset; top 5 = '+pc(t5)+'.']);
    const once=c.filter(x=>x.pp.size===1).length/c.length,ge3=c.filter(x=>x.pp.size>=3).length/c.length;
    if(dp.length<2)items.push(['info','Data baru tersedia '+dp.length+' bulan ('+pl(lp)+'), frekuensi belanja & repeat order belum bisa dinilai.']);else
    items.push([once>0.6?'bad':once>0.45?'warn':'good',pc(once,0)+' dari '+c.length+' customer hanya belanja di 1 bulan; '+pc(ge3,0)+' belanja ≥ 3 bulan.']);
    if(P.length>=3){const recent=new Set(P.slice(-2));const lost=c.filter(x=>![...x.pp].some(p=>recent.has(p)));if(lost.length){const lo=lost.reduce((a,x)=>a+x.o,0);items.push([lost.length/c.length>0.5?'bad':'warn',lost.length+' customer tidak belanja di 2 bulan terakhir (omset sebelumnya '+rp(lo)+'). Prioritas kunjungan ulang.']);}}
    const ar=agg(rows,r=>r.a).sort((a,b)=>b.o-a.o);items.push([ar[0].o/tot>0.7?'warn':'info','Area terbesar '+ar[0].k+' = '+pc(ar[0].o/tot)+' omset ('+ar.length+' area).']);
    const sl=agg(rows.filter(r=>!/TIDAK ADA DATA/.test(r.s)),r=>r.s).sort((a,b)=>b.o-a.o);if(!sl.length)items.push(['info','Data salesman tidak tersedia di file distributor ini.']);else{const s3=sl.slice(0,3).reduce((a,x)=>a+x.o,0)/tot;items.push([s3>0.75?'warn':'info','Salesman terbesar '+sl[0].k+' = '+pc(sl[0].o/tot)+'; top 3 salesman = '+pc(s3)+' dari '+sl.length+' salesman.']);}
    if(S.f.seg==='ALL'){const eo=rows.filter(r=>r.sg==='ELITE').reduce((a,r)=>a+r.o,0);const zc=c.filter(x=>rows.some(r=>r.key===x.k&&r.sg==='ZAK')&&!rows.some(r=>r.key===x.k&&r.sg==='ELITE')).length;
      items.push(['info','Elite Crème '+pc(eo/tot)+' · SPK Zak '+pc(1-eo/tot)+' dari omset.'+(zc?' '+zc+' customer zak belum membeli Elite Crème (peluang cross-selling).':'')]);}
    out.push({dist:d,tot,items,mom:pp?delta(ol,op):NaN});
  }
  return out;
}

function table(el,id,cols,data,o={}){
  const st=S.sort[id]||o.sort||{k:cols.find(c=>c.num)&&cols.find(c=>c.num).k,d:-1};
  const q=(S.search[id]||'').toLowerCase();
  let rows=data;
  if(q)rows=rows.filter(r=>cols.some(c=>!c.num&&String(r[c.k]==null?'':r[c.k]).toLowerCase().includes(q)));
  if(st&&st.k){const c=cols.find(c=>c.k===st.k);rows=rows.slice().sort((a,b)=>{const x=c&&c.sv?c.sv(a):a[st.k],y=c&&c.sv?c.sv(b):b[st.k];return (typeof x==='number'&&typeof y==='number'?x-y:String(x==null?'':x).localeCompare(String(y==null?'':y)))*st.d;});}
  const lim=o.limit||50,all=S.show[id];const shown=all?rows:rows.slice(0,lim);
  let h='';

  h+=shown.map((r,i)=>'<tr>'+cols.map(c=>{const v=c.k==='#'?i+1:r[c.k];return '<td class="'+(c.num?'n':'')+(c.wrap?' wrapc':'')+'">'+(c.h?c.h(r,i):c.f?c.f(v,r):esc(v))+'</td>';}).join('')+'</tr>').join('');
  if(o.total)h+='<tr class="tot">'+cols.map(c=>'<td class="'+(c.num?'n':'')+'">'+(o.total[c.k]!==undefined?o.total[c.k]:'')+'</td>').join('')+'</tr>';
  h+='</tbody></table></div>';
  if(!rows.length)h+='<div class="empty">Tidak ada data untuk filter ini.</div>';
  if(rows.length>lim)h+='<div class="more"><button class="btn" type="button" id="more_'+id+'">'+(all?'Tampilkan '+lim+' teratas':'Tampilkan semua '+nf(rows.length)+' baris')+'</button></div>';
  el.innerHTML=h;
  el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k==='#')return;const cur=S.sort[id]||st;S.sort[id]={k,d:cur.k===k?-cur.d:(cols.find(c=>c.k===k).num?-1:1)};table(el,id,cols,data,o);});
  const qi=el.querySelector('#q_'+id);if(qi)qi.oninput=()=>{S.search[id]=qi.value;const pos=qi.selectionStart;table(el,id,cols,data,o);const n=el.querySelector('#q_'+id);n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
  const mb=el.querySelector('#more_'+id);if(mb)mb.onclick=()=>{S.show[id]=!S.show[id];table(el,id,cols,data,o);};
  if(o.after)o.after(el);

function calcCustDetail(mode,top){top=top||'all';
  const y=S.f.year;const MS=Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0'));
  const lastP=S.periods.filter(p=>p.startsWith(y)).pop()||'';
  const rows=S.rows.filter(r=>r.p.startsWith(y)&&hasD(r.d)&&(S.f.seg==='ALL'||r.sg===S.f.seg));
  const areaOf=dominant(rows,r=>r.key,r=>r.a||'(kosong)');
  const m=new Map();
  for(const r of rows){
    const parts=mode==='q'?[[r.sg==='ZAK'?'Zak':'Pcs',r.sg==='ZAK'?zakOf(r):pcsOf(r)]]:[['',mode==='kg'?r.kg:r.o]];
    for(const [u,val] of parts){const k=r.key+'|'+u;let a=m.get(k);if(!a){a={key:r.key,dist:r.d,area:areaOf.get(r.key),cust:r.cn,unit:u,pm:{},tot:0,ov:0,okg:0};m.set(k,a);}
      a.pm[r.p]=(a.pm[r.p]||0)+val;a.tot+=val;a.ov+=r.o;a.okg+=r.kg;}
  }
  const list=[...m.values()].filter(a=>Math.abs(a.tot)>1e-9||mode!=='q').sort((a,b)=>DORDER.indexOf(a.dist)-DORDER.indexOf(b.dist)||a.area.localeCompare(b.area)||b.ov-a.ov||a.unit.localeCompare(b.unit));
  const metric=a=>mode==='v'?a.ov:a.okg;
  const per=new Map();list.forEach(a=>per.set(a.key,(per.get(a.key)||0)+(mode==='q'?a.okg:a.tot)));
  const grand=[...per.values()].reduce((s,x)=>s+x,0);
  const ranked=[...per.entries()].sort((a,b)=>b[1]-a[1]);
  const rank=new Map();let cum=0;ranked.forEach(([k,v],i)=>{cum+=v;rank.set(k,{r:i+1,share:grand?v/grand:0,cum:grand?cum/grand:0});});
  let out=list;
  if(top!=='all'){let keys;if(top==='p80'){keys=new Set();for(const [k,v] of ranked){keys.add(k);if(rank.get(k).cum>=0.8)break;}}else keys=new Set(ranked.slice(0,+top).map(x=>x[0]));
    out=list.filter(a=>keys.has(a.key)).sort((a,b)=>rank.get(a.key).r-rank.get(b.key).r||a.unit.localeCompare(b.unit));
    out.forEach(a=>{const x=rank.get(a.key);a.no=x.r;a.share=x.share;a.cum=x.cum;});}
  else{list.forEach((a,i)=>{const x=rank.get(a.key);a.no=i+1;a.share=x.share;a.cum=x.cum;a.rank=x.r;});}
  const nCust=new Set(out.map(a=>a.key)).size;
  const shown=[...new Set(out.map(a=>a.key))].reduce((s,k)=>s+per.get(k),0);
  return {y,MS,lastP,list:out,top,nCust,totCust:per.size,shownShare:grand?shown/grand:0};
}

function calcRekap(){
  const y=S.f.year;const MS=Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0'));
  const lastP=S.periods.filter(p=>p.startsWith(y)).pop()||'';
  const rows=S.rows.filter(r=>r.p.startsWith(y)&&hasD(r.d)&&(S.f.seg==='ALL'||r.sg===S.f.seg));
  function block(rs){const v=MS.map(()=>0),oa=MS.map(()=>new Set()),pcs=MS.map(()=>0),zak=MS.map(()=>0);rs.forEach(r=>{const i=+r.p.slice(5)-1;v[i]+=r.o;oa[i].add(r.key);if(r.sg==='ZAK')zak[i]+=r.kg/25;else pcs[i]+=/500 GR/.test(r.pr)?r.kg/0.5:r.kg;});
    const rd=x=>Math.round(x*100)/100;
    const seen=new Set();const cum=MS.map((p,i)=>{oa[i].forEach(k=>seen.add(k));return p<=lastP?seen.size:null;});
    return {pcs:MS.map((p,i)=>p<=lastP?rd(pcs[i]):null),zak:MS.map((p,i)=>p<=lastP?rd(zak[i]):null),tp:rd(pcs.reduce((a,b)=>a+b,0)),tz:rd(zak.reduce((a,b)=>a+b,0)),v:MS.map((p,i)=>p<=lastP?v[i]:null),oa:MS.map((p,i)=>p<=lastP?oa[i].size:null),cum,tv:v.reduce((a,b)=>a+b,0),tu:new Set(rs.map(r=>r.key)).size};}
  const out=[];
  for(const d of S.dists.filter(hasD)){const rd=rows.filter(r=>r.d===d);if(!rd.length)continue;
    const areas=[...new Set(rd.map(r=>r.a||'(kosong)'))].map(a=>({a,b:block(rd.filter(r=>(r.a||'(kosong)')===a))})).sort((x,z)=>z.b.tv-x.b.tv);
    areas.forEach(x=>out.push({type:'row',dist:d,area:x.a,b:x.b}));
    out.push({type:'sub',dist:d,area:'Subtotal '+d,b:block(rd)});}
  if(out.length)out.push({type:'gt',dist:'GRAND TOTAL',area:'',b:block(rows)});
  return {y,MS,lastP,out};
}
function calcRepeat(){
  const P=rangeP();const NR=8;
  const all=S.rows.filter(r=>r.p<=S.f.to&&hasD(r.d)&&(S.f.seg==='ALL'||r.sg===S.f.seg));
  const areaOf=dominant(all,r=>r.key,r=>r.a||'(kosong)');
  const cust=new Map();
  for(const r of all){let c=cust.get(r.key);if(!c){c={d:r.d,a:areaOf.get(r.key),mp:new Set()};cust.set(r.key,c);}if(inRange(r.p))c.mp.add(r.p);}
  const blank=()=>({cl:0,oa:0,none:0,one:0,rep:Array(NR).fill(0)});
  const add=(b,c)=>{b.cl++;const n=c.mp.size;if(!n){b.none++;return;}b.oa++;if(n===1)b.one++;else b.rep[Math.min(n-1,NR)-1]++;};
  const out=[];
  for(const d of S.dists.filter(hasD)){const cs=[...cust.values()].filter(c=>c.d===d);if(!cs.length)continue;
    const areas=[...new Set(cs.map(c=>c.a))];const rowsA=areas.map(a=>{const b=blank();cs.filter(c=>c.a===a).forEach(c=>add(b,c));return {type:'row',dist:d,area:a,b};}).sort((x,y)=>y.b.oa-x.b.oa||y.b.cl-x.b.cl);
    out.push(...rowsA);const sb=blank();cs.forEach(c=>add(sb,c));out.push({type:'sub',dist:d,area:'Subtotal',b:sb});}
  if(out.length){const g=blank();cust.forEach(c=>add(g,c));out.push({type:'gt',dist:'GRAND TOTAL',area:'',b:g});}
  out.forEach(o=>{o.b.repTot=o.b.rep.reduce((a,x)=>a+x,0);o.b.pRep=o.b.oa?o.b.repTot/o.b.oa:0;o.b.pOA=o.b.cl?o.b.oa/o.b.cl:0;});
  return {out,NR,months:P.length,first:S.rows.length?S.periods[0]:''};
}

/* ---------- persistence ---------- */
const CHUNK=200000;
async function saveDataset(rows,kons,meta){
  const s=JSON.stringify(SOPack.pack(rows,kons));const ver='v'+Date.now();const n=Math.ceil(s.length/CHUNK);
  for(let i=0;i<n;i++)await S.db.doc('datasetChunks/'+ver+'_'+i).set({part:s.slice(i*CHUNK,(i+1)*CHUNK),i});
  const old=S.cur&&S.cur.version?S.cur:null;
  const m=Object.assign({},meta,{version:ver,chunks:n});
  await S.db.doc('dataset/current').set(m);S.cur=m;S.loadedVersion=ver;
  if(old&&old.version!==ver){for(let i=0;i<old.chunks;i++){try{await S.db.doc('datasetChunks/'+old.version+'_'+i).delete();}catch(e){}}}
}
async function loadDataset(m){
  if(!m||!m.version||!m.chunks||m.version===S.loadedVersion)return;
  let s='';for(let i=0;i<m.chunks;i++){const snap=await S.db.doc('datasetChunks/'+m.version+'_'+i).get();const d=snap.data();if(!d)return;s+=d.part;}
  const u=SOPack.unpack(JSON.parse(s));u.meta={file:m.file,loaded:m.loaded,sheets:m.sheets};S.cur=m;S.loadedVersion=m.version;setData(u);
}

    const el=$('#view');
    const canvas=await html2canvas(el,{scale:1.6,backgroundColor:css('--bg')||'#ffffff',useCORS:true,logging:false,windowWidth:1820});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
    const PW=297,PH=210,M=10,HD=20,W=PW-2*M;
    const head=(n,tot)=>{pdf.setFillColor(15,37,87);pdf.rect(0,0,PW,14,'F');pdf.setTextColor(255,255,255);pdf.setFont('helvetica','bold');pdf.setFontSize(12);
      pdf.text('Sell Out Distributor SPK - '+tabName.trim(),M,9);pdf.setFont('helvetica','normal');pdf.setFontSize(8);
      pdf.text('Hal '+n+' / '+tot,PW-M,9,{align:'right'});pdf.setTextColor(80,90,110);
      const seg={ALL:'Semua segmen',ELITE:'Elite Creme',ZAK:'SPK Zak'}[S.f.seg];
      pdf.text('Periode '+pl(S.f.from)+' - '+pl(S.f.to)+'  |  Distributor: '+distName()+'  |  '+seg+'  |  Dibuat '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),M,18);};
    const pxPerMm=canvas.width/W;const sliceH=Math.floor((PH-HD-M)*pxPerMm);
    const pages=Math.max(1,Math.ceil(canvas.height/sliceH));
    for(let i=0;i<pages;i++){
      if(i)pdf.addPage();head(i+1,pages);
      const h=Math.min(sliceH,canvas.height-i*sliceH);
      const c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,h);g.drawImage(canvas,0,i*sliceH,canvas.width,h,0,0,canvas.width,h);
      pdf.addImage(c.toDataURL('image/jpeg',0.86),'JPEG',M,HD+1,W,h/pxPerMm);
    }
    const name=('Sell Out '+tabName.trim()+' '+(allD()?'Semua Distributor':S.f.dsel.length<=2?S.f.dsel.join(' - '):S.f.dsel.length+' Distributor')+' '+S.f.from+' sd '+S.f.to).replace(/[^A-Za-z0-9 _.&-]/g,'')+'.pdf';
    const data=pdf.output('arraybuffer');
    if(window.claude&&window.claude.use){let dl=null;try{dl=await window.claude.use('downloads');}catch(e){}
      if(!dl){toast('Simpan PDF tidak tersedia di tampilan ini.',5000);}
      else{try{await dl.save({filename:name,data});toast('PDF disimpan: '+name+'. Silakan bagikan file tersebut.',6000);}
        catch(e){const c=e&&e.code;toast(c==='declined'?'Simpan PDF dibatalkan.':c==='rate_limited'?'Tunggu sebentar lalu coba lagi.':'Gagal menyimpan PDF: '+((e&&e.message)||'coba lagi'),5000);}}}
    else{pdf.save(name);toast('PDF diunduh: '+name);}
  }catch(e){console.error(e);toast('Gagal membuat PDF: '+(e.message||e),6000);}
  finally{root.classList.remove('pdf');if(dark){if(prevTheme)root.setAttribute('data-theme',prevTheme);else root.removeAttribute('data-theme');}render();btn.disabled=false;btn.textContent=lbl;}
};

/* ---------- boot ---------- */
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{for(const k in charts)charts[k].resize();},150);});
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function boot(){
  try{const u=SOPack.unpack(JSON.parse($('#seed').textContent));setData(u);}catch(e){console.error(e);render();}
  if(window.claude&&window.claude.use){window.claude.use('db').then(db=>{if(!db)return;S.db=db;
    db.doc('dataset/current').onSnapshot(snap=>{const m=snap.data();if(m)loadDataset(m).catch(e=>console.error(e));},()=>{});}).catch(()=>{});}
}
if(typeof Chart==='undefined')window.addEventListener('load',boot);else boot();
})();
</script>
